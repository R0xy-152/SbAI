<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TV-01 Gal UI Shell — local presentation fixture"
    />
    <title>Gal UI Shell · TV-01</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Galgame user interface shell">
      <div class="scene-background" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>

      <section class="character-layer" aria-label="当前角色">
        <img
          id="character-sprite"
          class="character-sprite"
          data-character="deepseek"
          data-expression="normal"
          src="../char/deepseek/pic/deepseek_main.png"
          alt="DeepSeek 的角色立绘"
        />
      </section>

      <nav class="scene-hotspots" aria-label="调查场景">
        <button type="button" class="scene-hotspot hotspot-note" data-hotspot-id="CH1_NOTE_01">桌上的纸</button>
        <button type="button" class="scene-hotspot hotspot-terminal" data-hotspot-id="CH1_TERMINAL_MAIN">终端</button>
        <button type="button" class="scene-hotspot hotspot-claude" data-hotspot-id="CH1_C02_DOOR">C-02隔离门</button>
        <button type="button" class="scene-hotspot hotspot-registry" data-hotspot-id="CH1_CHARACTER_REGISTRY">角色注册表</button>
      </nav>

      <section id="paper-panel" class="paper-panel" hidden aria-label="纸张涂画">
        <button type="button" id="paper-close" class="paper-close">关闭</button>
        <p>在纸面上拖动，让压痕显现。</p>
        <div id="rubbing-surface" class="rubbing-surface">
          <p class="paper-message">03:17<br />不要把管理员权限交给<br />“最会替你解释的人”。<br />—— V03</p>
          <div id="rubbing-cover" class="rubbing-cover"></div>
        </div>
      </section>

      <section class="dialogue-panel" aria-live="polite" aria-atomic="true">
        <p id="character-name" class="character-name">DeepSeek</p>
        <p id="dialogue-text" class="dialogue-text">
          ……你醒了。别怕，我们先弄清楚这里发生了什么。
        </p>
      </section>

      <div class="toolbar">
        <div class="character-switcher" role="group" aria-label="切换对话角色">
          <button type="button" id="switch-deepseek" class="character-switch is-active">
            DeepSeek
          </button>
          <button type="button" id="switch-claude" class="character-switch">Claude</button>
        </div>
        <button type="button" id="history-toggle" class="history-toggle">查看历史</button>
        <button type="button" id="evidence-toggle" class="history-toggle">证据</button>
      </div>

      <section id="history-panel" class="history-panel" hidden>
        <h2 class="history-title">对话历史</h2>
        <ol id="history-list" class="history-list"></ol>
      </section>

      <section id="evidence-panel" class="evidence-panel" hidden aria-label="证据">
        <h2 class="history-title">证据</h2>
        <p id="evidence-empty" class="evidence-empty">尚未获得证据。</p>
        <ol id="evidence-list" class="evidence-list"></ol>
      </section>

      <form id="deduction-form" class="deduction-form" novalidate>
        <label for="deduction-message">指出证词中的矛盾</label>
        <input id="deduction-message" type="text" maxlength="240" placeholder="例如：你没看到 DeepSeek，为什么说是她开的？" />
        <button type="submit">提交推理</button>
      </form>

      <form id="player-form" class="player-input" novalidate>
        <label class="sr-only" for="player-message">输入要对 DeepSeek 说的话</label>
        <input
          id="player-message"
          name="message"
          type="text"
          maxlength="240"
          autocomplete="off"
          placeholder="输入你想说的话…"
          required
        />
        <button type="submit">发送</button>
      </form>

      <p id="form-status" class="form-status" role="status"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
