map $http_x_forwarded_for $auth_limit_key {
  default $http_x_forwarded_for;
  "" $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_login:1m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api 反向代理到 backend 服务（Docker Compose 内网名）。
  # 使用变量 + Docker DNS 延迟解析：frontend-only 运行时 nginx 也能启动，
  # backend 服务加入后 /api 自动连通。
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 邀请码虽为高熵凭据，仍在边缘限制暴力尝试；只占用 1 MiB 共享内存。
  location = /api/auth/login {
    limit_req zone=auth_login burst=5 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 游戏静态资源由 backend 仓库根静态挂载服务（docs/13 Task 9 Step 3）。
  # proxy_pass $backend 无尾路径 → 保留完整 URI（/char/... 等），与 dev 一致。
  location /char/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location /backgroud/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location /frontend-deprecated/ {
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
  }
}
