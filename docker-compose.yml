# docs/13 §30：最终本地运行使用 Docker Compose（frontend-vue / backend / postgres）。
# backend 用 PostgreSQL 存档（docs/13 §16 snapshot=JSONB）；会话持久化仍走 JSON
# （docs/13 Task 6：最小改动，存档是 docs 要求的 PostgreSQL 接入点）。
# 本机无 Docker 时可用 npm run dev + backend:8000 等价验证（docs/13 Task 1 路径）。
services:
  frontend-vue:
    build:
      context: ./frontend-vue
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GAL_PROVIDER: mock
      GAL_SAVE_BACKEND: postgres
      GAL_POSTGRES_DSN: postgresql://gal:gal@postgres:5432/gal
    # T2review P1-15：backend 只绑定宿主 loopback（前端 nginx 经 Compose 内网
    # 反代 /api），不发布到所有网络接口。
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gal
      POSTGRES_PASSWORD: gal
      POSTGRES_DB: gal
    # T2review P1-15：postgres 仅在 Compose 内网可见，不发布宿主端口。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gal -d gal"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

